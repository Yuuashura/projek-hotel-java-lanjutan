server.port=${PORT:8080}
spring.application.name=api-gateway
spring.codec.max-in-memory-size=15MB

# ==========================================
# 🌐 GLOBAL CORS CONFIGURATION
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS:*} 
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ==========================================
# 🚦 ROUTING CONFIGURATIONS
# ==========================================

# 1. User Service Route
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# 2. Hotel Service Route
spring.cloud.gateway.routes[1].id=hotel-service
spring.cloud.gateway.routes[1].uri=${HOTEL_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/hotels/**,/api/room-types/**,/api/cities/**,/api/facilities/**

# 3. Booking Service Route
spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=${BOOKING_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**

max_request=5000
time_window_second=300

# ==========================================
# 📖 SWAGGER / SPRINGDOC CONFIGURATION
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/user
springdoc.swagger-ui.urls[1].name=Hotel Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/hotel
springdoc.swagger-ui.urls[2].name=Booking Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/booking

# Route for individual service api-docs via gateway (rewrite path to /v3/api-docs)
spring.cloud.gateway.routes[3].id=swagger-user
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/v3/api-docs/user
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/v3/api-docs/user,/v3/api-docs

spring.cloud.gateway.routes[4].id=swagger-hotel
spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/hotel
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/v3/api-docs/hotel,/v3/api-docs

spring.cloud.gateway.routes[5].id=swagger-booking
spring.cloud.gateway.routes[5].uri=http://localhost:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/booking
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/v3/api-docs/booking,/v3/api-docs