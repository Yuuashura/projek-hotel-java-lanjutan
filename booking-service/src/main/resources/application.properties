server.port=${PORT:8083}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/ngninep_booking}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (HARUS SAMA dengan user-service & hotel-service)
jwt.secret=${JWT_SECRET:change-this-minimum-64-character-secret-for-jwt-signing-key-security-requirements}
jwt.expiration=${JWT_EXPIRATION:3600000}

hotel.service.url=${HOTEL_SERVICE_URL:http://localhost:8082}

# Xendit Payment Configuration
xendit.base-url=${XENDIT_BASE_URL:https://api.xendit.co}
xendit.api-key=${XENDIT_API_KEY:}
xendit.callback-token=${XENDIT_CALLBACK_TOKEN:}
xendit.success-redirect-url=${XENDIT_SUCCESS_REDIRECT_URL:http://localhost:5173/my-bookings}
xendit.failure-redirect-url=${XENDIT_FAILURE_REDIRECT_URL:http://localhost:5173/my-bookings}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Application URL used in notification emails
app.name=NgiNep
app.url=${APP_URL:http://localhost:5173}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
