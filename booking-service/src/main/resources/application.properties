server.port=${PORT:8083}

# Activate local profile by default for local development
spring.profiles.active=local

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ngninep_booking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (HARUS SAMA dengan user-service & hotel-service)
jwt.secret=${JWT_SECRET:change-this-minimum-32-character-secret}
jwt.expiration=${JWT_EXPIRATION:3600000}

hotel.service.url=${HOTEL_SERVICE_URL:http://localhost:8082}

# Mail Notification
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:your-email@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:your-gmail-app-password}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
