version: '3.8'

services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
    volumes:
      - ./user-service/uploads:/app/uploads/user-service
    restart: always

  hotel-service:
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    container_name: hotel-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
    volumes:
      - ./hotel-service/uploads:/app/uploads/hotel-service
    restart: always

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - HOTEL_SERVICE_URL=http://hotel-service:8082
    volumes:
      - ./booking-service/uploads:/app/uploads/booking-service
    restart: always

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - hotel-service
      - booking-service
    environment:
      - PORT=8080
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8081}
      - HOTEL_SERVICE_URL=${HOTEL_SERVICE_URL:-http://hotel-service:8082}
      - BOOKING_SERVICE_URL=${BOOKING_SERVICE_URL:-http://booking-service:8083}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: always
