services:
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=${USER_DB_URL:?Set USER_DB_URL in .env}
      - SPRING_DATASOURCE_USERNAME=${USER_DB_USERNAME:?Set USER_DB_USERNAME in .env}
      - SPRING_DATASOURCE_PASSWORD=${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - LOGIN_RATE_LIMIT_EMAIL_IP=${LOGIN_RATE_LIMIT_EMAIL_IP:-10}
      - LOGIN_RATE_LIMIT_IP=${LOGIN_RATE_LIMIT_IP:-30}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
    volumes:
      - ./user-service/uploads:/app/uploads/user-service
    restart: always

  hotel-service:
    build:
      context: ./hotel-service
      dockerfile: Dockerfile
    container_name: hotel-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - SPRING_DATASOURCE_URL=${HOTEL_DB_URL:?Set HOTEL_DB_URL in .env}
      - SPRING_DATASOURCE_USERNAME=${HOTEL_DB_USERNAME:?Set HOTEL_DB_USERNAME in .env}
      - SPRING_DATASOURCE_PASSWORD=${HOTEL_DB_PASSWORD:?Set HOTEL_DB_PASSWORD in .env}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
    volumes:
      - ./hotel-service/uploads:/app/uploads/hotel-service
    restart: always

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - SPRING_DATASOURCE_URL=${BOOKING_DB_URL:?Set BOOKING_DB_URL in .env}
      - SPRING_DATASOURCE_USERNAME=${BOOKING_DB_USERNAME:?Set BOOKING_DB_USERNAME in .env}
      - SPRING_DATASOURCE_PASSWORD=${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - HOTEL_SERVICE_URL=http://hotel-service:8082
      - XENDIT_BASE_URL=${XENDIT_BASE_URL:-https://api.xendit.co}
      - XENDIT_API_KEY=${XENDIT_API_KEY:-}
      - XENDIT_CALLBACK_TOKEN=${XENDIT_CALLBACK_TOKEN:-}
      - XENDIT_SUCCESS_REDIRECT_URL=${XENDIT_SUCCESS_REDIRECT_URL:-http://localhost:5173/my-bookings}
      - XENDIT_FAILURE_REDIRECT_URL=${XENDIT_FAILURE_REDIRECT_URL:-http://localhost:5173/my-bookings}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env}
      - APP_URL=${APP_URL:-http://localhost:5173}
    volumes:
      - ./booking-service/uploads:/app/uploads/booking-service
    restart: always

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - hotel-service
      - booking-service
    environment:
      - PORT=8080
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8081}
      - HOTEL_SERVICE_URL=${HOTEL_SERVICE_URL:-http://hotel-service:8082}
      - BOOKING_SERVICE_URL=${BOOKING_SERVICE_URL:-http://booking-service:8083}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://deciduous-unfurrowed-august.ngrok-free.dev}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    environment:
      - VITE_PROXY_TARGET=http://api-gateway:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    command:
      - http
      - frontend:5173
      - --url=${NGROK_URL:-https://deciduous-unfurrowed-august.ngrok-free.dev}
      - --log=stdout
    ports:
      - "4040:4040"
    restart: always

volumes:
  frontend_node_modules:
